# Déploie le frontend sur GitHub Pages à chaque push sur main
name: Déploiement frontend (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          DEPLOY_BASE: /app-suivit-sport/
        run: npm run build

      # GitHub Pages sert 404.html pour les URLs inconnues : on y met une
      # copie de l'app pour que les routes React (/competition/...) marchent
      # en accès direct ou au rafraîchissement.
      - name: Fallback SPA
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Configuration GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
